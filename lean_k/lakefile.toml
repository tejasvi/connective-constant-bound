name = "Saw38a"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Saw38aKP"]

# Toolchain leanprover/lean4:v4.35.0-rc3; Mathlib c55e6e786f49 (lake-manifest.json).
# The proof itself is built with plain `lean` by tools/build_k26f.sh (48,000+ generated modules); this file serves
# `lake exe cache get` (Mathlib) and `lake env` (LEAN_PATH). The libraries below build the hand-written layer.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Saw38aCore"
globs = ["Saw38aCore.+"]

[[lean_lib]]
name = "Saw38a"
globs = ["Saw38a.+"]

[[lean_lib]]
name = "Saw38aK"
globs = ["Saw38aK.+"]

[[lean_lib]]
name = "Saw38aKP"
globs = ["Saw38aKP.+"]
